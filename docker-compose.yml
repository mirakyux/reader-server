services:
  reader:
    build:
      context: .
      dockerfile: Dockerfile.source
    restart: unless-stopped
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    environment:
      SPRING_PROFILES_ACTIVE: prod
      READER_APP_SECURE: ${READER_APP_SECURE:-false}
      READER_APP_SECUREKEY: ${READER_APP_SECUREKEY:-}
      READER_APP_INVITECODE: ${READER_APP_INVITECODE:-}
      READER_APP_CACHECHAPTERCONTENT: "true"
      READER_SERVER_CORS_ALLOWEDORIGINS: ${READER_CORS_ALLOWED_ORIGINS:-http://localhost:4396,http://127.0.0.1:4396}
      READER_APP_BROWSERURL: http://browser:8090
      READER_APP_BROWSERTOKEN: ${READER_BROWSER_TOKEN:?Set READER_BROWSER_TOKEN in .env}
    depends_on:
      - browser
    expose:
      - "8080"
  browser:
    build:
      context: ./browser
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      READER_BROWSER_TOKEN: ${READER_BROWSER_TOKEN:?Set READER_BROWSER_TOKEN in .env}
    expose:
      - "8090"
  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - reader
    ports:
      - "${READER_WEB_PORT:-4396}:80"
