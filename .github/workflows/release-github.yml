name: Package independent releases
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and validate API
        run: chmod +x gradlew && ./gradlew --no-daemon test bootJar
      - name: Build and validate React
        working-directory: web
        run: npm ci && npm run lint && npm test && npm run build
      - name: Package web
        run: tar -czf reader-web.tar.gz -C web/dist .
      - name: Validate browser
        working-directory: browser
        run: npm ci && npx playwright install --with-deps chromium && npm test
      - name: Package browser
        run: tar -czf reader-browser.tar.gz -C browser package.json package-lock.json server.mjs quickjs.mjs quickjs-worker.mjs quickjs-runtime README.md Dockerfile
      - uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            build/backend/libs/reader.jar
            reader-web.tar.gz
            reader-browser.tar.gz
