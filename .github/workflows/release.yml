name: Publish separate API and web images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile.source
            suffix: latest
          - name: api
            context: .
            dockerfile: Dockerfile.openj9
            suffix: openj9-latest
          - name: api
            context: .
            dockerfile: Dockerfile.slim
            suffix: slim-latest
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
            suffix: latest
          - name: browser
            context: ./browser
            dockerfile: ./browser/Dockerfile
            suffix: latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve registry image
        id: image
        env:
          READER_REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${READER_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=raw,value=${{ matrix.suffix }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.suffix }}
